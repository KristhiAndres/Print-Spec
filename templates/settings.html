{% extends "base.html" %}

{% block title %}Configuración{% endblock %}
{% block header %}Configuración del Sistema{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6">
        <div class="glass-panel p-4">
            <h5 class="text-secondary mb-4"><i class="bi bi-database-gear me-2"></i>Conexión Base de Datos</h5>
            
            <form id="dbConfigForm">
                <div class="mb-3">
                    <label class="form-label">Host de MySQL</label>
                    <input type="text" class="form-control" id="db_host" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Puerto</label>
                    <input type="number" class="form-control" id="db_port" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="db_user" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="db_password">
                </div>
                <div class="mb-4">
                    <label class="form-label">Nombre Base de Datos</label>
                    <input type="text" class="form-control" id="db_name" required>
                </div>
                
                <button type="submit" class="btn btn-primary px-4" id="saveBtn">
                    <i class="bi bi-save me-2"></i>Guardar y Reiniciar
                </button>
            </form>
            
            <div id="alertPlaceholder" class="mt-3"></div>
        </div>
    </div>
</div>
{% endblock %}
