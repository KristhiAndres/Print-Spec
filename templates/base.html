<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintAudit - {% block title %}Dashboard{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
</head>
<body class="light-theme">
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="glass-sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 text-primary fs-4 fw-bold text-uppercase border-bottom">
                <img src="/static/img/logo.png" alt="PrintAudit Logo" style="max-height: 40px; margin-right: 10px;">
                PrintAudit
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="/" class="list-group-item list-group-item-action bg-transparent {% if request.url.path == '/' %}active{% endif %}">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="/logs" class="list-group-item list-group-item-action bg-transparent {% if request.url.path == '/logs' %}active{% endif %}">
                    <i class="bi bi-card-list me-2"></i>Registros
                </a>
                <a href="/settings" class="list-group-item list-group-item-action bg-transparent {% if request.url.path == '/settings' %}active{% endif %}">
                    <i class="bi bi-gear me-2"></i>Configuración
                </a>
            </div>
        </div>
        <!-- /#sidebar-wrapper -->

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light glass-navbar py-3 px-4">
                <div class="d-flex align-items-center">
                    <i class="bi bi-list fs-3 text-secondary me-3" id="menu-toggle" style="cursor: pointer;"></i>
                    <h2 class="fs-4 m-0">{% block header %}Overview{% endblock %}</h2>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4 content-area">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom JS -->
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
